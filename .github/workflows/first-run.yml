# Installs the package from GitHub the way the README tells users to, on clean
# runners with no Python setup and no caches, then runs each feature once.
# A second R session checks that the cached environment and models are reused.
name: First run

on:
  # Monday 06:15 UTC. Catches Hugging Face, model, and Python-stack breakage
  # between releases. rag() stays off here: TinyLLAMA is about 2 GB. Dispatch
  # the workflow with rag=true to include it. This run does not call YouTube.
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      rag:
        description: "Also run rag() (downloads TinyLLAMA, about 2 GB)"
        type: boolean
        default: true
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  first-run:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # rag only when someone dispatches the workflow and turns it on.
      # Pull requests and the weekly schedule leave it off.
      SMOKE_RAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.rag) && 'true' || 'false' }}

    steps:
      # Only the smoke script is used from the checkout; the package itself is
      # installed with remotes::install_github below
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install from GitHub
        shell: Rscript {0}
        run: |
          t0 <- Sys.time()
          install.packages("remotes")
          remotes::install_github(
            "${{ github.repository }}",
            ref = "${{ github.event.pull_request.head.sha || github.sha }}",
            upgrade = "never"
          )
          message("Install took ", round(difftime(Sys.time(), t0, units = "mins"), 1), " min")

      - name: First run
        run: Rscript .github/scripts/first-run.R first

      - name: Second session
        run: Rscript .github/scripts/first-run.R second
